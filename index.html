<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Color Your Names</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: one narrow column, one task at a time; the color stage is a fixed neutral grey in both themes */
:root {
  --bg: #F6F4EF; --surface: #FFFFFF; --fg: #1B2632; --muted: #5E6672; --line: #DCD6CA;
  --accent: #2C3B4D; --accent-fg: #FFFFFF; --warm: #A35139; --soft: #EEE9DF;
  --stage: #808080; --stage-line: #6E6E6E;
  --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: var(--sans);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161D26; --surface: #1F2934; --fg: #ECE7DD; --muted: #A3ABB5; --line: #33404E;
  --accent: #EEE9DF; --accent-fg: #1B2632; --warm: #E08E6D; --soft: #26313D; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161D26; --surface: #1F2934; --fg: #ECE7DD; --muted: #A3ABB5; --line: #33404E;
  --accent: #EEE9DF; --accent-fg: #1B2632; --warm: #E08E6D; --soft: #26313D; color-scheme: dark }

* { box-sizing: border-box; }
html, body { margin: 0; }
img { max-width: 100%; }
body { -webkit-text-size-adjust: 100%; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: -0.01em; font-size: 17px; }
.step { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
h1 { font-size: 24px; line-height: 1.35; margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
h2 { font-size: 19px; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
ul.checks { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.ex { background: var(--soft); border-radius: 10px; padding: 12px 14px; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
.ex b { font-family: var(--mono); font-weight: 500; }
label { font-weight: 500; font-size: 15px; }
input[type=text] { width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--bg); color: var(--fg); }
input[type=text]:focus { outline: none; border-color: var(--accent); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
button { font: inherit; font-weight: 500; font-size: 16px; padding: 12px 18px; border-radius: 10px; border: 1.5px solid var(--accent); cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-fg); flex: 1; }
button.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--warm); outline-offset: 2px; }
.err { color: var(--warm); font-size: 14px; min-height: 1.2em; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
/* the color stage: neutral grey surround, same in both themes */
.stage { background: var(--stage); border-radius: 14px; padding: 36px; display: grid; place-items: center; }
.patch { width: min(62vw, 240px); aspect-ratio: 1; max-width: 100%; border-radius: 6px; }
.code { font-family: var(--mono); font-size: 12px; word-break: break-all; background: var(--soft); border-radius: 10px; padding: 12px; max-height: 140px; overflow: auto; user-select: all; }
.ok { font-size: 14px; color: var(--muted); }
/* ranking */
.q { font-size: 18px; font-weight: 500; }
.q em { font-style: normal; font-family: var(--mono); background: var(--soft); padding: 1px 6px; border-radius: 6px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 520px) { .grid.n3, .grid.n5, .grid.n6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.opt { position: relative; padding: 0; border: 2px solid transparent; border-radius: 12px; overflow: hidden; background: var(--soft); }
.opt img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.opt .tag { position: absolute; left: 8px; top: 8px; font-family: var(--mono); font-size: 12px; background: rgba(0,0,0,.55); color: #fff; padding: 2px 7px; border-radius: 6px; }
.opt .rk { position: absolute; right: 8px; top: 8px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 17px; }
.opt.on { border-color: var(--accent); }
.foot { font-size: 13px; color: var(--muted); text-align: center; }
/* rainbow text: saturated stops that stay readable on both themes */
.rainbow { font-size: 17px; font-weight: 600; line-height: 1.55;
  background: linear-gradient(90deg, #D7263D, #F46036, #E9A100, #2E9E44, #1B98E0, #3D5AFE, #8E44AD);
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rainbow {
  background-image: linear-gradient(90deg, #FF6B6B, #FF9F43, #FECA57, #48DB71, #54A0FF, #7F8CFF, #C56CF0); } }
ul.checks.emoji { list-style: none; padding-left: 0; gap: 8px; }
ul.checks.emoji li { display: flex; gap: 10px; align-items: flex-start; }
ul.checks.emoji li > span:first-child { flex: none; width: 1.4em; text-align: center; }
.pidtag { font-family: var(--mono); font-weight: 500; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.choice { background: var(--bg); color: var(--fg); border: 1.5px solid var(--line); text-align: left; padding: 11px 14px; font-weight: 400; }
.choice.on { border-color: var(--accent); background: var(--soft); font-weight: 500; }
.plate { width: min(72vw, 280px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: #fff; }
.plate-stage { background: #F2F0EA; border-radius: 14px; padding: 20px; display: grid; place-items: center; }
.wait { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.clock { font-family: var(--mono); font-feature-settings: "tnum"; font-size: 34px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>

<script>
/* One session: ID -> name 7 colors -> (our images are generated on the study server meanwhile) -> short survey with a simple
   color-vision check -> wait if needed -> rank 10 trials (ours + 4 baselines). Responses go to the Google Sheet (apps_script.gs).
   Patch colors: XKCD population mean (CIELAB) of peach, teal, lavender, maroon, gold, magenta, beige; the words are never shown. */
const COLORS = [
  { k: "c1", hex: "#EFA578" }, { k: "c2", hex: "#47B29E" }, { k: "c3", hex: "#B480D0" }, { k: "c4", hex: "#832437" },
  { k: "c5", hex: "#CFB02D" }, { k: "c6", hex: "#CB2E97" }, { k: "c7", hex: "#D5C085" } ];
const TRIALS = [
  { id: "t01", color: "peach", object: "sweater" }, { id: "t02", color: "teal", object: "vase" },
  { id: "t03", color: "lavender", object: "dress" }, { id: "t04", color: "maroon", object: "chair" },
  { id: "t05", color: "gold", object: "coin" }, { id: "t06", color: "magenta", object: "umbrella" },
  { id: "t07", color: "beige", object: "sofa" }, { id: "t08", color: "teal", object: "car" },
  { id: "t09", color: "peach", object: "bowl" }, { id: "t10", color: "maroon", object: "door" } ];
const BASELINES = ["sd35", "flux", "richtext", "colorwave"];       // images/<trial>/<key>.jpg (participant-independent)
const VERSION = "cs2";
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwCvTPmdHTpjzjaPpZdl-j-OjecBMxxow6NTYnPsXauXDs4bW_SNbMGTN_sO14J0y8W/exec";
let SERVER = "";                                                    // from config.json (the study server's public address)

const app = document.getElementById("app");
const S = { pid: "", order: [], i: 0, answers: [], t0: 0, job: "", survey: {}, ours: {}, eta: 0, etaAt: 0, trial: 0, pick: [], shown: {} };
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const device = () => ({ w: screen.width, h: screen.height, dpr: window.devicePixelRatio || 1,
  dark: matchMedia("(prefers-color-scheme: dark)").matches, ua: navigator.userAgent.slice(0, 160) });
const encode = obj => VERSION + "." + btoa(unescape(encodeURIComponent(JSON.stringify(obj))));

async function sheet(body) {                                        // append one row to the Google Sheet
  const opt = { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) };
  for (let t = 0; t < 3; t++) {
    try { const r = await fetch(ENDPOINT, opt); const j = await r.json(); if (j.ok) return true; }
    catch (e) { try { await fetch(ENDPOINT, Object.assign({}, opt, { mode: "no-cors" })); return true; } catch (e2) {} }
    await sleep(800 * (t + 1));
  }
  return false;
}
async function api(path, body) {                                    // the study server
  const r = await fetch(SERVER + path, body ? { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) } : {});
  if (!r.ok) throw new Error("server " + r.status);
  return r.json();
}
function view(html) { app.innerHTML = html; window.scrollTo(0, 0); }
const header = step => `<header><span class="brand">🎨 Color Your Names</span><span class="step">${esc(step)}</span></header>`;
const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + " min " + String(s % 60).padStart(2, "0") + " s"; };

/* ---------------- start ---------------- */
function home() {
  if (!S.pid) S.pid = "P" + Date.now().toString(36).slice(-4).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase();   // random participant ID
  view(`${header("About 10 min")}
  <h1>The same color word can mean slightly different colors to different people.</h1>
  <p class="rainbow">Color is a really fascinating topic, especially since we’re taught so many different and often contradictory ideas about rainbows, different primary colors, and frequencies of light.</p>
  <p class="muted">In this study, we learn how you name colors and test whether images can be generated in the colors you have in mind. You will name a few colors, answer a short survey, and then rank images, all in one session.</p>
  <div class="card">
    <h2>Before you start</h2>
    <ul class="checks emoji">
      <li><span aria-hidden="true">🔆</span><span>Keep your screen brightness at its usual level, and turn off night mode or any blue-light filter.</span></li>
      <li><span aria-hidden="true">🎨</span><span>Seven colors will appear one at a time. Type the name that comes to mind, <b>in English</b>.</span></li>
      <li><span aria-hidden="true">💬</span><span>There are no right or wrong answers. Use the name you would normally use.</span></li>
    </ul>
    <div class="ex"><span class="muted">Examples</span><span><b>blue</b>, <b>light green</b>, <b>salmon</b>, <b>dusty rose</b>, <b>mustard yellow</b></span></div>
  </div>
  <div class="card">
    <p class="muted" style="font-size:14px">Your participant ID: <b class="pidtag">${esc(S.pid)}</b></p>
    <div class="err" id="err"></div>
    <div class="btns"><button class="primary" id="go">Start</button></div>
  </div>`);
  const go = async () => {
    const err = document.getElementById("err");
    try { const h = await api("/health"); if (!h.ok || !h.workers) throw 0; }
    catch (e) { err.textContent = "We cannot reach the study server right now. Please try again in a moment or contact the researcher."; return; }
    S.order = shuffle(COLORS); S.i = 0; S.answers = []; naming();
  };
  document.getElementById("go").onclick = go;
}

/* ---------------- 1. naming ---------------- */
function naming() {
  const c = S.order[S.i], n = S.order.length;
  view(`${header(`Color ${S.i + 1} of ${n}`)}
  <div class="bar"><i style="width:${(S.i / n) * 100}%"></i></div>
  <div class="stage"><div class="patch" style="background:${c.hex}" role="img" aria-label="Color sample ${S.i + 1}"></div></div>
  <div class="card">
    <label for="nm">What would you call this color?</label>
    <input type="text" id="nm" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e.g., light green">
    <div class="err" id="err"></div>
    <div class="btns"><button class="primary" id="next">${S.i + 1 < n ? "Next" : "Done"}</button></div>
  </div>`);
  S.t0 = performance.now();
  const inp = document.getElementById("nm"); inp.focus({ preventScroll: true });
  const next = () => {
    const v = inp.value.trim(), err = document.getElementById("err");
    if (!v) { err.textContent = "Please type a name."; return; }
    if (/[^\x20-\x7E]/.test(v)) { err.textContent = "Please type the name in English."; return; }
    S.answers.push({ k: c.k, hex: c.hex, name: v.toLowerCase(), ms: Math.round(performance.now() - S.t0) });
    S.i++; S.i < n ? naming() : submitNaming();
  };
  document.getElementById("next").onclick = next;
  inp.onkeydown = e => { if (e.key === "Enter") next(); };
}

async function submitNaming() {
  view(`${header("One moment")}<h1>Sending your answers…</h1>`);
  for (let t = 0; t < 3 && !S.job; t++) {
    try { const r = await api("/submit", { pid: S.pid, answers: S.answers.map(a => ({ hex: a.hex, name: a.name })) }); S.job = r.job; setEta(r.eta_s); }
    catch (e) { await sleep(1500); }
  }
  if (!S.job) {
    view(`${header("Connection error")}<h1>Your answers could not be sent to the study server.</h1>
    <div class="card"><p class="muted">Please check your internet connection and try again.</p><div class="btns"><button class="primary" id="re">Try again</button></div></div>`);
    document.getElementById("re").onclick = submitNaming; return;
  }
  ls.set("job_" + S.pid, S.job); poll(); survey(0);
}

/* our images: poll the server in the background */
function setEta(s) { S.eta = s; S.etaAt = Date.now(); }
const etaLeft = () => Math.max(0, S.eta - (Date.now() - S.etaAt) / 1000);
async function poll() {
  while (Object.keys(S.ours).length < TRIALS.length) {
    try { const r = await api("/status?job=" + S.job);
      for (const [k, u] of Object.entries(r.images)) S.ours[k] = SERVER + u;
      if (Math.abs(r.eta_s - etaLeft()) > 5) setEta(r.eta_s); } catch (e) {}
    await sleep(3000);
  }
}

/* ---------------- 2. survey (while the images are generated) ---------------- */
const PLATES = [                                                    // simple pseudo-isochromatic plates (screening only)
  { id: "p0", digit: "12", kind: "control" }, { id: "p1", digit: "8", kind: "rg" },
  { id: "p2", digit: "29", kind: "rg" }, { id: "p3", digit: "74", kind: "rg" } ];
const QUESTIONS = [
  { id: "age", q: "What is your age group?", opts: ["Under 20", "20–29", "30–39", "40–49", "50–59", "60–69", "70 or older"] },
  { id: "device", q: "Which device are you using right now?", opts: ["Phone", "Tablet", "Laptop", "Desktop monitor"] },
  { id: "cvd", q: "Have you ever been diagnosed with color vision deficiency (color blindness)?", opts: ["No", "Yes"] } ];

function survey(k) {
  const total = QUESTIONS.length + PLATES.length;
  if (k < QUESTIONS.length) {
    const Q = QUESTIONS[k];
    view(`${header(`Question ${k + 1} of ${total}`)}
    <p class="muted">While we generate your images, here are a few short questions.</p>
    <div class="card"><h2>${esc(Q.q)}</h2>
      <div class="choices">${Q.opts.map(o => `<button class="choice" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>`);
    app.querySelectorAll(".choice").forEach(b => b.onclick = () => { S.survey[Q.id] = b.dataset.v; survey(k + 1); });
    return;
  }
  const j = k - QUESTIONS.length;
  if (j >= PLATES.length) return afterSurvey();
  const P = PLATES[j];
  view(`${header(`Question ${k + 1} of ${total}`)}
  <div class="card"><h2>Quick color vision check</h2>
    <p class="muted" style="font-size:14px">Type the number you see in the circle. If you see no number, tap "I see none". (This is for reference only, not a diagnosis.)</p></div>
  <div class="plate-stage"><canvas class="plate" id="plate" width="560" height="560" aria-label="Color vision plate ${j + 1}"></canvas></div>
  <div class="card">
    <input type="text" id="ans" inputmode="numeric" autocomplete="off" placeholder="Number">
    <div class="btns"><button class="ghost" id="none">I see none</button><button class="primary" id="ok">Next</button></div>
  </div>`);
  drawPlate(document.getElementById("plate"), P);
  const done = v => { S.survey["plate_" + P.id] = { digit: P.digit, answer: v }; survey(k + 1); };
  document.getElementById("ok").onclick = () => { const v = document.getElementById("ans").value.trim(); if (v) done(v); };
  document.getElementById("none").onclick = () => done("none");
  document.getElementById("ans").onkeydown = e => { if (e.key === "Enter" && e.target.value.trim()) done(e.target.value.trim()); };
}

function drawPlate(cv, P) {
  const ctx = cv.getContext("2d"), W = cv.width, R = W / 2 - 6;
  const mask = document.createElement("canvas"); mask.width = mask.height = W; const m = mask.getContext("2d");
  m.fillStyle = "#000"; m.font = `bold ${P.digit.length > 1 ? 250 : 320}px Arial, sans-serif`; m.textAlign = "center"; m.textBaseline = "middle";
  m.fillText(P.digit, W / 2, W / 2 + 12); const md = m.getImageData(0, 0, W, W).data;
  const inside = (x, y) => md[(Math.floor(y) * W + Math.floor(x)) * 4 + 3] > 128;
  const FG = P.kind === "control" ? ["#3E4A63", "#4B5873", "#36415A"] : ["#D8784F", "#CF6C46", "#E08A60", "#C96A48"];
  const BG = P.kind === "control" ? ["#D9C9A8", "#E3D5B8", "#CFBE9C"] : ["#A2A85A", "#98A052", "#AEB466", "#8F984C"];
  let seed = 7 + P.digit.charCodeAt(0); const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  ctx.clearRect(0, 0, W, W); const dots = [];
  for (let t = 0; t < 9000 && dots.length < 1100; t++) {
    const r = 5 + rnd() * 9, a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * (R - r);
    const x = W / 2 + Math.cos(a) * d, y = W / 2 + Math.sin(a) * d;
    if (dots.some(o => (o.x - x) ** 2 + (o.y - y) ** 2 < (o.r + r + 1.5) ** 2)) continue;
    dots.push({ x, y, r });
    const pal = inside(x, y) ? FG : BG; ctx.fillStyle = pal[Math.floor(rnd() * pal.length)];
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
}

async function afterSurvey() {
  S.sends = [sheet({ type: "naming", pid: S.pid, job: S.job, answers: S.answers, survey: S.survey, device: device(), at: new Date().toISOString(), v: VERSION })];
  S.trial = 0; S.shown = {}; nextTrial();
}

/* ---------------- 3. ranking ---------------- */
async function nextTrial() {
  if (S.trial >= TRIALS.length) return finish();
  const T = TRIALS[S.trial];
  if (!S.ours[T.id]) return waiting(T);
  trial(T);
}

function waiting(T) {
  const done = Object.keys(S.ours).length;
  view(`${header("Preparing images")}
  <h1>We are generating images in your colors.</h1>
  <div class="card">
    <div class="wait"><span class="clock" id="clock">${fmt(etaLeft())}</span><span class="muted">left. Please wait a moment.</span></div>
    <div class="bar"><i id="pg" style="width:${done * 10}%"></i></div>
    <p class="muted" style="font-size:14px" id="cnt">${done} / ${TRIALS.length} done · Please keep this page open.</p>
  </div>`);
  const tick = setInterval(() => {
    const c = document.getElementById("clock"); if (!c) return clearInterval(tick);
    const left = etaLeft(); c.textContent = left > 0 ? fmt(left) : "Almost done";
    const d = Object.keys(S.ours).length; document.getElementById("pg").style.width = d * 10 + "%";
    document.getElementById("cnt").textContent = `${d} / ${TRIALS.length} done · Please keep this page open.`;
    if (S.ours[T.id]) { clearInterval(tick); trial(T); }
  }, 1000);
}

function trial(T) {
  const n = TRIALS.length;
  if (!S.shown[T.id]) S.shown[T.id] = shuffle(["ours"].concat(BASELINES));
  S.pick = [];
  const order = S.shown[T.id];
  const src = k => k === "ours" ? S.ours[T.id] : `images/${T.id}/${k}.jpg`;
  view(`${header(`Item ${S.trial + 1} of ${n}`)}
  <div class="bar"><i style="width:${(S.trial / n) * 100}%"></i></div>
  <div class="card">
    <p class="q">Which <em>${esc(T.object)}</em> in the image is closer to your <em>${esc(T.color)}</em>?</p>
    <p class="muted" style="font-size:14px">Tap the images in order, starting with the one closest to what <b>${esc(T.color)}</b> means to you. When all images are ranked, you can continue.</p>
  </div>
  <div class="grid n${order.length}" id="grid">${order.map((k, j) => `
    <button class="opt" data-k="${esc(k)}" aria-label="Image ${String.fromCharCode(65 + j)}">
      <img src="${esc(src(k))}" alt=""><span class="tag">${String.fromCharCode(65 + j)}</span></button>`).join("")}
  </div>
  <div class="btns"><button class="ghost" id="reset">Reset</button><button class="primary" id="next" disabled>${S.trial + 1 < n ? "Next" : "Done"}</button></div>`);
  const grid = document.getElementById("grid"), next = document.getElementById("next");
  const paint = () => {
    grid.querySelectorAll(".opt").forEach(b => {
      const r = S.pick.indexOf(b.dataset.k); b.classList.toggle("on", r >= 0);
      const old = b.querySelector(".rk"); if (old) old.remove();
      if (r >= 0) b.insertAdjacentHTML("beforeend", `<span class="rk">${r + 1}</span>`);
    });
    next.disabled = S.pick.length !== order.length;
  };
  grid.onclick = e => { const b = e.target.closest(".opt"); if (!b) return; const k = b.dataset.k;
    const r = S.pick.indexOf(k); r >= 0 ? S.pick.splice(r, 1) : S.pick.push(k); paint(); };
  document.getElementById("reset").onclick = () => { S.pick = []; paint(); };
  next.onclick = () => {
    S.sends = (S.sends || []).concat(sheet({ type: "rank", pid: S.pid, job: S.job, trial: T.id, object: T.object, color: T.color, rank: S.pick.slice(), shown: order.slice(),
            at: new Date().toISOString(), v: VERSION }));                         // sent in the background
    S.ranks = Object.assign(S.ranks || {}, { [T.id]: S.pick.slice() }); S.trial++; nextTrial();
  };
}

async function finish() {
  view(`${header("Saving")}<h1>Saving your responses…</h1><p class="muted">Please keep this page open.</p>`);
  const ok = (await Promise.all(S.sends || [])).every(Boolean);
  if (ok) return view(`${header("Done")}
    <h1>You have finished. Thank you for taking part!</h1>
    <div class="card"><p>Your responses have been saved. You may now close this page.</p></div>`);
  const code = encode({ pid: S.pid, job: S.job, answers: S.answers, survey: S.survey, shown: S.shown, ranks: S.ranks, v: VERSION });
  view(`${header("Please check")}
    <h1>Some responses may not have been saved.</h1>
    <div class="card"><p class="muted">Please copy the code below and send it to the researcher.</p><div class="code">${esc(code)}</div></div>`);
}

(async () => {
  try { const c = await (await fetch("config.json", { cache: "no-store" })).json(); SERVER = (c.server || "").replace(/\/$/, ""); } catch (e) {}
  home();
})();
</script>
</body>
</html>
