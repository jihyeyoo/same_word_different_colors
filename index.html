<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Color Your Names</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: one narrow column, one task at a time; the color stage is a fixed neutral grey in both themes */
:root {
  --bg: #F6F4EF; --surface: #FFFFFF; --fg: #1B2632; --muted: #5E6672; --line: #DCD6CA;
  --accent: #2C3B4D; --accent-fg: #FFFFFF; --warm: #A35139; --soft: #EEE9DF;
  --stage: #808080; --stage-line: #6E6E6E;
  --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: var(--sans);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161D26; --surface: #1F2934; --fg: #ECE7DD; --muted: #A3ABB5; --line: #33404E;
  --accent: #EEE9DF; --accent-fg: #1B2632; --warm: #E08E6D; --soft: #26313D; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161D26; --surface: #1F2934; --fg: #ECE7DD; --muted: #A3ABB5; --line: #33404E;
  --accent: #EEE9DF; --accent-fg: #1B2632; --warm: #E08E6D; --soft: #26313D; color-scheme: dark }

* { box-sizing: border-box; }
html, body { margin: 0; }
img { max-width: 100%; }
body { -webkit-text-size-adjust: 100%; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: -0.01em; font-size: 17px; }
.step { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
h1 { font-size: 24px; line-height: 1.35; margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
h2 { font-size: 19px; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
ul.checks { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.ex { background: var(--soft); border-radius: 10px; padding: 12px 14px; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
.ex b { font-family: var(--mono); font-weight: 500; }
label { font-weight: 500; font-size: 15px; }
input[type=text] { width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--bg); color: var(--fg); }
input[type=text]:focus { outline: none; border-color: var(--accent); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
button { font: inherit; font-weight: 500; font-size: 16px; padding: 12px 18px; border-radius: 10px; border: 1.5px solid var(--accent); cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-fg); flex: 1; }
button.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--warm); outline-offset: 2px; }
.err { color: var(--warm); font-size: 14px; min-height: 1.2em; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
/* the color stage: neutral grey surround, same in both themes */
.stage { background: var(--stage); border-radius: 14px; padding: 36px; display: grid; place-items: center; }
.patch { width: min(62vw, 240px); aspect-ratio: 1; max-width: 100%; border-radius: 6px; }
.code { font-family: var(--mono); font-size: 12px; word-break: break-all; background: var(--soft); border-radius: 10px; padding: 12px; max-height: 140px; overflow: auto; user-select: all; }
.ok { font-size: 14px; color: var(--muted); }
/* ranking */
.q { font-size: 18px; font-weight: 500; }
.q em { font-style: normal; font-family: var(--mono); background: var(--soft); padding: 1px 6px; border-radius: 6px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 520px) { .grid.n3, .grid.n5, .grid.n6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.opt { position: relative; padding: 0; border: 2px solid transparent; border-radius: 12px; overflow: hidden; background: var(--soft); }
.opt img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.opt .tag { position: absolute; left: 8px; top: 8px; font-family: var(--mono); font-size: 12px; background: rgba(0,0,0,.55); color: #fff; padding: 2px 7px; border-radius: 6px; }
.opt .rk { position: absolute; right: 8px; top: 8px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 17px; }
.opt.on { border-color: var(--accent); }
.foot { font-size: 13px; color: var(--muted); text-align: center; }
/* rainbow text: saturated stops that stay readable on both themes */
.rainbow { font-size: 17px; font-weight: 600; line-height: 1.55;
  background: linear-gradient(90deg, #D7263D, #F46036, #E9A100, #2E9E44, #1B98E0, #3D5AFE, #8E44AD);
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rainbow {
  background-image: linear-gradient(90deg, #FF6B6B, #FF9F43, #FECA57, #48DB71, #54A0FF, #7F8CFF, #C56CF0); } }
ul.checks.emoji { list-style: none; padding-left: 0; gap: 8px; }
ul.checks.emoji li { display: flex; gap: 10px; align-items: flex-start; }
ul.checks.emoji li > span:first-child { flex: none; width: 1.4em; text-align: center; }
.pidtag { font-family: var(--mono); font-weight: 500; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.choice { background: var(--bg); color: var(--fg); border: 1.5px solid var(--line); text-align: left; padding: 11px 14px; font-weight: 400; }
.choice.on { border-color: var(--accent); background: var(--soft); font-weight: 500; }
.plate { width: min(72vw, 280px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: #fff; }
.plate-stage { background: #F2F0EA; border-radius: 14px; padding: 20px; display: grid; place-items: center; }
.wait { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.clock { font-family: var(--mono); font-feature-settings: "tnum"; font-size: 34px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.grp { display: flex; flex-direction: column; gap: 6px; }
.grp-h { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 14px; font-weight: 400; padding: 6px 10px; border-radius: 999px; background: var(--bg); color: var(--fg); border: 1.5px solid var(--line); }
.chip small { color: var(--muted); margin-left: 4px; font-size: 12px; }
.chip.on { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
.chip.on small { color: var(--accent-fg); opacity: .8; }
.picked { font-size: 15px; } .picked b { font-weight: 600; }
.ko { font-size: 13px; color: var(--muted); }
.ab { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ab .opt .tag { font-size: 14px; padding: 3px 9px; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>

<script>
/* One session: ID -> name 7 colors (pick an English color word, Korean gloss shown; or type another English name) -> our images
   are generated on the study server meanwhile (SD 3.5 and FLUX.2, both guided toward the participant's predicted colors) ->
   short survey with a simple color-vision check -> 18 A/B choices (9 prompts x 2 generators: unguided vs. guided, same seed,
   random sides). Responses go to the Google Sheet (apps_script.gs: naming rows; A/B rows use the "rank" sheet).
   Patch colors: XKCD population mean (CIELAB) of peach, teal, lavender, maroon, gold, magenta, beige; the words are never shown. */
const COLORS = [
  { k: "c1", hex: "#EFA578" }, { k: "c2", hex: "#47B29E" }, { k: "c3", hex: "#B480D0" }, { k: "c4", hex: "#832437" },
  { k: "c5", hex: "#CFB02D" }, { k: "c6", hex: "#CB2E97" }, { k: "c7", hex: "#D5C085" } ];
const PALETTE = [                                                    // all in the predictor's 1,000-name vocabulary
  ["빨강 계열", [["red","빨강"],["dark red","진한 빨강"],["bright red","밝은 빨강"],["crimson","진홍"],["scarlet","주홍빛 빨강"],["cherry red","체리색"],["burgundy","버건디"],["maroon","적갈색"],["wine","와인색"],["brick red","벽돌색"]]],
  ["분홍 계열", [["pink","분홍"],["light pink","연분홍"],["pale pink","옅은 분홍"],["hot pink","진분홍"],["rose","장밋빛"],["dusty rose","탁한 장밋빛"],["salmon","연어색"],["coral","산호색"],["peach","복숭아색"],["magenta","자홍"],["fuchsia","푸크시아"],["mauve","연보라빛 분홍"]]],
  ["주황 계열", [["orange","주황"],["light orange","연주황"],["dark orange","진주황"],["burnt orange","탁한 주황"],["tangerine","귤색"],["apricot","살구색"],["rust","녹슨 주황"]]],
  ["갈색 계열", [["brown","갈색"],["light brown","연갈색"],["dark brown","진갈색"],["tan","황갈색"],["beige","베이지"],["khaki","카키"],["chocolate","초콜릿색"],["coffee","커피색"],["caramel","캐러멜색"],["sienna","시에나"]]],
  ["노랑 계열", [["yellow","노랑"],["light yellow","연노랑"],["pale yellow","옅은 노랑"],["lemon","레몬색"],["mustard","겨자색"],["gold","금색"],["cream","크림색"],["yellow green","연두"]]],
  ["초록 계열", [["green","초록"],["light green","연초록"],["dark green","진초록"],["lime green","라임 그린"],["lime","라임"],["olive","올리브"],["olive green","올리브 그린"],["mint","민트"],["sea green","바다빛 초록"],["forest green","숲 초록"],["grass green","풀색"],["kelly green","켈리 그린"],["emerald","에메랄드"],["sage","세이지"]]],
  ["파랑 계열", [["blue","파랑"],["light blue","연파랑"],["dark blue","진파랑"],["navy","남색"],["navy blue","네이비 블루"],["royal blue","로열 블루"],["sky blue","하늘색"],["baby blue","연하늘색"],["cobalt","코발트"],["teal","청록"],["turquoise","터키석색"],["aqua","아쿠아"],["cyan","시안"],["periwinkle","연보랏빛 파랑"],["cornflower","수레국화색"],["steel blue","강철빛 파랑"]]],
  ["보라 계열", [["purple","보라"],["light purple","연보라"],["dark purple","진보라"],["violet","바이올렛"],["lavender","라벤더"],["lilac","라일락"],["plum","자두색"],["indigo","남보라"],["orchid","난초색"],["grape","포도색"]]],
  ["무채색", [["gray","회색"],["light gray","연회색"],["dark gray","진회색"],["silver","은색"],["charcoal","숯색"],["slate","청회색"],["black","검정"],["white","흰색"],["off-white","미색"]]] ];
const KO = Object.fromEntries(PALETTE.flatMap(g => g[1]));
const PROMPTS = [                                                    // trials_ab.json (seed 0); unguided: images_ab/<id>/<gen>.jpg
  { id: "c01", color: "red", object: "사과" }, { id: "c03", color: "blue", object: "청바지" },
  { id: "c04", color: "brown", object: "초콜릿" }, { id: "c05", color: "orange", object: "호박" },
  { id: "c06", color: "gold", object: "동전" }, { id: "c07", color: "yellow", object: "달" },
  { id: "c09", color: "green", object: "나뭇잎" }, { id: "c12", color: "emerald", object: "보석" },
  { id: "c13", color: "pink", object: "돼지 저금통" } ];
const GENS = ["sd35", "flux"];
let ITEMS = GENS.flatMap(g => PROMPTS.map(p => Object.assign({ gen: g, key: p.id + "_" + g }, p)));     // 18 A/B items (only the generators the server serves)
const VERSION = "ab1";
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwCvTPmdHTpjzjaPpZdl-j-OjecBMxxow6NTYnPsXauXDs4bW_SNbMGTN_sO14J0y8W/exec";
let SERVER = "";                                                    // from config.json (the study server's public address)

const app = document.getElementById("app");
const S = { pid: "", order: [], i: 0, answers: [], t0: 0, job: "", survey: {}, ours: {}, eta: 0, etaAt: 0, queue: [], done: 0, sides: {}, choices: {} };
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const device = () => ({ w: screen.width, h: screen.height, dpr: window.devicePixelRatio || 1,
  dark: matchMedia("(prefers-color-scheme: dark)").matches, ua: navigator.userAgent.slice(0, 160) });
const encode = obj => VERSION + "." + btoa(unescape(encodeURIComponent(JSON.stringify(obj))));

async function sheet(body) {                                        // append one row to the Google Sheet
  const opt = { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) };
  for (let t = 0; t < 3; t++) {
    try { const r = await fetch(ENDPOINT, opt); const j = await r.json(); if (j.ok) return true; }
    catch (e) { try { await fetch(ENDPOINT, Object.assign({}, opt, { mode: "no-cors" })); return true; } catch (e2) {} }
    await sleep(800 * (t + 1));
  }
  return false;
}
async function api(path, body) {                                    // the study server
  const r = await fetch(SERVER + path, body ? { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) } : {});
  if (!r.ok) throw new Error("server " + r.status);
  return r.json();
}
function view(html) { app.innerHTML = html; window.scrollTo(0, 0); }
const header = step => `<header><span class="brand">🎨 Color Your Names</span><span class="step">${esc(step)}</span></header>`;
const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + "분 " + String(s % 60).padStart(2, "0") + "초"; };

/* ---------------- start ---------------- */
function home() {
  if (!S.pid) S.pid = "P" + Date.now().toString(36).slice(-4).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase();   // random participant ID
  view(`${header("약 10–15분")}
  <h1>The same color word can mean slightly different colors to different people.</h1>
  <div><p class="rainbow">Color is a really fascinating topic, especially since we’re taught so many different and often contradictory ideas about rainbows, different primary colors, and frequencies of light.</p>
  <p class="ko">색은 정말 흥미로운 주제예요. 무지개, 서로 다른 삼원색, 빛의 주파수에 대해 우리는 저마다 다르고 때로는 서로 모순되는 이야기들을 배우니까요.</p></div>
  <p class="muted">이 연구에서는 여러분이 색에 이름을 붙이는 방식을 알아보고, 여러분이 떠올리는 색으로 이미지를 만들 수 있는지 확인합니다. 색 이름 붙이기, 짧은 설문, 이미지 비교 순서로 한 번에 진행됩니다.</p>
  <div class="card">
    <h2>시작하기 전에</h2>
    <ul class="checks emoji">
      <li><span aria-hidden="true">🔆</span><span>화면 밝기는 평소대로 두고, 야간 모드나 블루라이트 필터는 꺼 주세요.</span></li>
      <li><span aria-hidden="true">🎨</span><span>색 7개가 하나씩 나옵니다. 각 색을 가장 잘 나타내는 <b>영어 색 이름</b>을 목록에서 골라 주세요. 목록에 없으면 직접 입력할 수 있어요.</span></li>
      <li><span aria-hidden="true">💬</span><span>정답은 없습니다. 평소 그 색을 부르는 이름을 골라 주세요.</span></li>
    </ul>
  </div>
  <div class="card">
    <p class="muted" style="font-size:14px">참가자 ID: <b class="pidtag">${esc(S.pid)}</b></p>
    <div class="err" id="err"></div>
    <div class="btns"><button class="primary" id="go">시작하기</button></div>
  </div>`);
  const go = async () => {
    const err = document.getElementById("err");
    try { const h = await api("/health"); if (!h.ok || !h.workers) throw 0;
          if (h.gens) ITEMS = ITEMS.filter(x => h.gens.includes(x.gen)); }
    catch (e) { err.textContent = "지금은 연구 서버에 연결할 수 없습니다. 잠시 후 다시 시도하거나 연구자에게 문의해 주세요."; return; }
    S.tStart = performance.now(); S.startedAt = new Date().toISOString(); S.timing = {};
    S.order = shuffle(COLORS); S.i = 0; S.answers = []; naming();
  };
  document.getElementById("go").onclick = go;
}

/* ---------------- 1. naming: pick an English color word (Korean gloss) or type another English name ---------------- */
function naming() {
  const c = S.order[S.i], n = S.order.length; let pick = "";
  view(`${header(`색 ${S.i + 1} / ${n}`)}
  <div class="bar"><i style="width:${(S.i / n) * 100}%"></i></div>
  <div class="stage"><div class="patch" style="background:${c.hex}" role="img" aria-label="색 샘플 ${S.i + 1}"></div></div>
  <div class="card">
    <label>이 색을 영어로 뭐라고 부르시겠어요?</label>
    <p class="picked" id="picked"><span class="muted">아래에서 하나를 골라 주세요.</span></p>
    ${PALETTE.map(([g, ws]) => `<div class="grp"><span class="grp-h">${esc(g)}</span><div class="chips">${ws.map(([w, k]) =>
      `<button class="chip" data-w="${esc(w)}">${esc(w)}<small>${esc(k)}</small></button>`).join("")}</div></div>`).join("")}
    <div class="grp"><span class="grp-h">기타 (목록에 없으면 영어로 직접 입력)</span>
      <input type="text" id="nm" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="예: dusty blue"></div>
    <div class="err" id="err"></div>
    <div class="btns"><button class="primary" id="next">${S.i + 1 < n ? "다음" : "완료"}</button></div>
  </div>`);
  S.t0 = performance.now();
  const inp = document.getElementById("nm"), shown = document.getElementById("picked");
  const paint = () => {
    app.querySelectorAll(".chip").forEach(b => b.classList.toggle("on", b.dataset.w === pick));
    shown.innerHTML = pick ? `선택: <b>${esc(pick)}</b>${KO[pick] ? ` <span class="muted">(${esc(KO[pick])})</span>` : ""}` : `<span class="muted">아래에서 하나를 골라 주세요.</span>`;
  };
  app.querySelectorAll(".chip").forEach(b => b.onclick = () => { pick = b.dataset.w; inp.value = ""; paint(); });
  inp.oninput = () => { pick = inp.value.trim().toLowerCase(); paint(); };
  const next = () => {
    const err = document.getElementById("err");
    if (!pick) { err.textContent = "색 이름을 하나 골라 주세요."; return; }
    if (/[^\x20-\x7E]/.test(pick)) { err.textContent = "직접 입력할 때는 영어로 적어 주세요."; return; }
    S.answers.push({ k: c.k, hex: c.hex, name: pick, typed: !KO[pick], ms: Math.round(performance.now() - S.t0) });
    S.i++; if (S.i >= n) S.timing.naming_ms = Math.round(performance.now() - S.tStart);
    S.i < n ? naming() : submitNaming();
  };
  document.getElementById("next").onclick = next;
  inp.onkeydown = e => { if (e.key === "Enter") next(); };
}

async function submitNaming() {
  view(`${header("잠시만요")}<h1>답변을 보내는 중입니다…</h1>`);
  for (let t = 0; t < 3 && !S.job; t++) {
    try { const r = await api("/submit", { pid: S.pid, answers: S.answers.map(a => ({ hex: a.hex, name: a.name })) }); S.job = r.job; setEta(r.eta_s); }
    catch (e) { await sleep(1500); }
  }
  if (!S.job) {
    view(`${header("연결 오류")}<h1>답변을 연구 서버로 보내지 못했습니다.</h1>
    <div class="card"><p class="muted">인터넷 연결을 확인하고 다시 시도해 주세요.</p><div class="btns"><button class="primary" id="re">다시 시도</button></div></div>`);
    document.getElementById("re").onclick = submitNaming; return;
  }
  ls.set("job_" + S.pid, S.job); poll(); survey(0);
}

/* our images: poll the server in the background */
function setEta(s) { S.eta = s; S.etaAt = Date.now(); }
const etaLeft = () => Math.max(0, S.eta - (Date.now() - S.etaAt) / 1000);
async function poll() {
  while (Object.keys(S.ours).length < ITEMS.length) {
    try { const r = await api("/status?job=" + S.job);
      for (const [k, u] of Object.entries(r.images)) S.ours[k] = SERVER + u;
      if (Math.abs(r.eta_s - etaLeft()) > 5) setEta(r.eta_s); } catch (e) {}
    await sleep(3000);
  }
}

/* ---------------- 2. survey (while the images are generated) ---------------- */
const PLATES = [                                                    // simple pseudo-isochromatic plates (screening only)
  { id: "p0", digit: "12", kind: "control" }, { id: "p1", digit: "8", kind: "rg" },
  { id: "p2", digit: "29", kind: "rg" }, { id: "p3", digit: "74", kind: "rg" } ];
const QUESTIONS = [
  { id: "age", q: "연령대를 선택해 주세요.", opts: ["20세 미만", "20–29세", "30–39세", "40–49세", "50–59세", "60–69세", "70세 이상"] },
  { id: "device", q: "지금 어떤 기기를 사용하고 계신가요?", opts: ["스마트폰", "태블릿", "노트북", "데스크톱 모니터"] },
  { id: "cvd", q: "색각 이상(색맹·색약) 진단을 받은 적이 있나요?", opts: ["아니요", "예"] } ];

function survey(k) {
  if (k === 0) S.tSurvey = performance.now();
  const total = QUESTIONS.length + PLATES.length;
  if (k < QUESTIONS.length) {
    const Q = QUESTIONS[k];
    view(`${header(`질문 ${k + 1} / ${total}`)}
    <p class="muted">이미지를 만드는 동안 몇 가지만 여쭤볼게요.</p>
    <div class="card"><h2>${esc(Q.q)}</h2>
      <div class="choices">${Q.opts.map(o => `<button class="choice" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>`);
    app.querySelectorAll(".choice").forEach(b => b.onclick = () => { S.survey[Q.id] = b.dataset.v; survey(k + 1); });
    return;
  }
  const j = k - QUESTIONS.length;
  if (j >= PLATES.length) return afterSurvey();
  const P = PLATES[j];
  view(`${header(`질문 ${k + 1} / ${total}`)}
  <div class="card"><h2>간단한 색각 확인</h2>
    <p class="muted" style="font-size:14px">원 안에 보이는 숫자를 입력해 주세요. 숫자가 보이지 않으면 "보이지 않음"을 눌러 주세요. (참고용이며 진단이 아닙니다.)</p></div>
  <div class="plate-stage"><canvas class="plate" id="plate" width="560" height="560" aria-label="색각 검사판 ${j + 1}"></canvas></div>
  <div class="card">
    <input type="text" id="ans" inputmode="numeric" autocomplete="off" placeholder="숫자">
    <div class="btns"><button class="ghost" id="none">보이지 않음</button><button class="primary" id="ok">다음</button></div>
  </div>`);
  drawPlate(document.getElementById("plate"), P);
  const done = v => { S.survey["plate_" + P.id] = { digit: P.digit, answer: v }; survey(k + 1); };
  document.getElementById("ok").onclick = () => { const v = document.getElementById("ans").value.trim(); if (v) done(v); };
  document.getElementById("none").onclick = () => done("none");
  document.getElementById("ans").onkeydown = e => { if (e.key === "Enter" && e.target.value.trim()) done(e.target.value.trim()); };
}
function drawPlate(cv, P) {
  const ctx = cv.getContext("2d"), W = cv.width, R = W / 2 - 6;
  const mask = document.createElement("canvas"); mask.width = mask.height = W; const m = mask.getContext("2d");
  m.fillStyle = "#000"; m.font = `bold ${P.digit.length > 1 ? 250 : 320}px Arial, sans-serif`; m.textAlign = "center"; m.textBaseline = "middle";
  m.fillText(P.digit, W / 2, W / 2 + 12); const md = m.getImageData(0, 0, W, W).data;
  const inside = (x, y) => md[(Math.floor(y) * W + Math.floor(x)) * 4 + 3] > 128;
  const FG = P.kind === "control" ? ["#3E4A63", "#4B5873", "#36415A"] : ["#D8784F", "#CF6C46", "#E08A60", "#C96A48"];
  const BG = P.kind === "control" ? ["#D9C9A8", "#E3D5B8", "#CFBE9C"] : ["#A2A85A", "#98A052", "#AEB466", "#8F984C"];
  let seed = 7 + P.digit.charCodeAt(0); const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  ctx.clearRect(0, 0, W, W); const dots = [];
  for (let t = 0; t < 9000 && dots.length < 1100; t++) {
    const r = 5 + rnd() * 9, a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * (R - r);
    const x = W / 2 + Math.cos(a) * d, y = W / 2 + Math.sin(a) * d;
    if (dots.some(o => (o.x - x) ** 2 + (o.y - y) ** 2 < (o.r + r + 1.5) ** 2)) continue;
    dots.push({ x, y, r });
    const pal = inside(x, y) ? FG : BG; ctx.fillStyle = pal[Math.floor(rnd() * pal.length)];
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
}

async function afterSurvey() {
  S.timing.survey_ms = Math.round(performance.now() - S.tSurvey);
  S.sends = [sheet({ type: "naming", pid: S.pid, job: S.job, answers: S.answers, survey: S.survey, device: device(),
                     timing: Object.assign({ started_at: S.startedAt }, S.timing), at: new Date().toISOString(), v: VERSION })];
  S.queue = shuffle(ITEMS.filter(x => x.gen === "sd35")).concat(shuffle(ITEMS.filter(x => x.gen === "flux")));   // SD 3.5 images are ready first
  S.done = 0; nextItem();
}

/* ---------------- 3. A/B choices ---------------- */
function nextItem() {
  if (!S.queue.length) return finish();
  const j = S.queue.findIndex(x => S.ours[x.key]);                   // the first item whose guided image is ready
  if (j < 0) return waiting();
  const [it] = S.queue.splice(j, 1); ab(it);
}

function waiting() {
  if (!S.waitStart) S.waitStart = performance.now();                  // time spent waiting before this item
  const total = ITEMS.length, made = () => Object.keys(S.ours).length;
  view(`${header("이미지 준비 중")}
  <h1>여러분의 색으로 이미지를 만들고 있어요.</h1>
  <div class="card">
    <div class="wait"><span class="clock" id="clock">${fmt(etaLeft())}</span><span class="muted">남았습니다. 잠시만 기다려 주세요.</span></div>
    <div class="bar"><i id="pg" style="width:${made() / total * 100}%"></i></div>
    <p class="muted" style="font-size:14px" id="cnt">${made()} / ${total} 완료 · 이 페이지를 닫지 말아 주세요.</p>
  </div>`);
  const tick = setInterval(() => {
    const c = document.getElementById("clock"); if (!c) return clearInterval(tick);
    const left = etaLeft(); c.textContent = left > 0 ? fmt(left) : "거의 다 됐어요";
    document.getElementById("pg").style.width = made() / total * 100 + "%";
    document.getElementById("cnt").textContent = `${made()} / ${total} 완료 · 이 페이지를 닫지 말아 주세요.`;
    if (S.queue.some(x => S.ours[x.key])) { clearInterval(tick); nextItem(); }
  }, 1000);
}

function ab(it) {
  S.waitMs = S.waitStart ? Math.round(performance.now() - S.waitStart) : 0; S.waitStart = 0; S.tItem = performance.now();
  const n = ITEMS.length, sides = shuffle(["guided", "unguided"]); S.sides[it.key] = sides;
  const src = k => k === "guided" ? S.ours[it.key] : `images_ab/${it.id}/${it.gen}.jpg`;
  view(`${header(`비교 ${S.done + 1} / ${n}`)}
  <div class="bar"><i style="width:${(S.done / n) * 100}%"></i></div>
  <div class="card">
    <p class="q">어느 쪽 <em>${esc(it.object)}</em>가 여러분이 생각하는 <em>${esc(it.color)}</em>에 더 가까운가요?</p>
    <p class="muted" style="font-size:14px">두 이미지 중 하나를 눌러 주세요. <b>${esc(it.color)}</b>(${esc(KO[it.color] || "")})라는 단어를 들었을 때 떠오르는 색을 기준으로 골라 주세요.</p>
  </div>
  <div class="ab" id="ab">${sides.map((k, j) => `
    <button class="opt" data-k="${k}" aria-label="이미지 ${"AB"[j]}"><img src="${esc(src(k))}" alt=""><span class="tag">${"AB"[j]}</span></button>`).join("")}
  </div>`);
  document.getElementById("ab").onclick = e => {
    const b = e.target.closest(".opt"); if (!b) return; const choice = b.dataset.k;
    S.choices[it.key] = choice;
    S.sends = (S.sends || []).concat(sheet({ type: "rank", pid: S.pid, job: S.job, trial: it.key, gen: it.gen, prompt: it.id, object: it.object, color: it.color,
            rank: [choice], shown: sides.slice(), choice, ms: Math.round(performance.now() - S.tItem), wait_ms: S.waitMs,
            elapsed_ms: Math.round(performance.now() - S.tStart), at: new Date().toISOString(), v: VERSION }));   // sent in the background
    S.done++; nextItem();
  };
}

async function finish() {
  view(`${header("저장 중")}<h1>응답을 저장하고 있어요…</h1><p class="muted">이 페이지를 닫지 말아 주세요.</p>`);
  const ok = (await Promise.all(S.sends || [])).every(Boolean);
  if (ok) return view(`${header("완료")}
    <h1>모두 끝났습니다. 참여해 주셔서 감사합니다!</h1>
    <div class="card"><p>응답이 저장되었습니다. 이제 페이지를 닫으셔도 됩니다.</p></div>`);
  const code = encode({ pid: S.pid, job: S.job, answers: S.answers, survey: S.survey, sides: S.sides, choices: S.choices, v: VERSION });
  view(`${header("확인 필요")}
    <h1>일부 응답이 저장되지 않았을 수 있습니다.</h1>
    <div class="card"><p class="muted">아래 코드를 복사해서 연구자에게 보내 주세요.</p><div class="code">${esc(code)}</div></div>`);
}

(async () => {
  try { const c = await (await fetch("config.json", { cache: "no-store" })).json(); SERVER = (c.server || "").replace(/\/$/, ""); } catch (e) {}
  home();
})();
</script>
</body>
