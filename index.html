<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Color Your Names</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: one narrow column, one task at a time; the color stage is a fixed neutral grey in both themes */
:root {
  --bg: #F6F4EF; --surface: #FFFFFF; --fg: #1B2632; --muted: #5E6672; --line: #DCD6CA;
  --accent: #2C3B4D; --accent-fg: #FFFFFF; --warm: #A35139; --soft: #EEE9DF;
  --stage: #808080; --stage-line: #6E6E6E;
  --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: var(--sans);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161D26; --surface: #1F2934; --fg: #ECE7DD; --muted: #A3ABB5; --line: #33404E;
  --accent: #EEE9DF; --accent-fg: #1B2632; --warm: #E08E6D; --soft: #26313D; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161D26; --surface: #1F2934; --fg: #ECE7DD; --muted: #A3ABB5; --line: #33404E;
  --accent: #EEE9DF; --accent-fg: #1B2632; --warm: #E08E6D; --soft: #26313D; color-scheme: dark }

* { box-sizing: border-box; }
html, body { margin: 0; }
img { max-width: 100%; }
body { -webkit-text-size-adjust: 100%; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: -0.01em; font-size: 17px; }
.step { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
h1 { font-size: 24px; line-height: 1.35; margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
h2 { font-size: 19px; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
ul.checks { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.ex { background: var(--soft); border-radius: 10px; padding: 12px 14px; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
.ex b { font-family: var(--mono); font-weight: 500; }
label { font-weight: 500; font-size: 15px; }
input[type=text] { width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--bg); color: var(--fg); }
input[type=text]:focus { outline: none; border-color: var(--accent); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
button { font: inherit; font-weight: 500; font-size: 16px; padding: 12px 18px; border-radius: 10px; border: 1.5px solid var(--accent); cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-fg); flex: 1; }
button.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--warm); outline-offset: 2px; }
.err { color: var(--warm); font-size: 14px; min-height: 1.2em; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
/* the color stage: neutral grey surround, same in both themes */
.stage { background: var(--stage); border-radius: 14px; padding: 36px; display: grid; place-items: center; }
.patch { width: min(62vw, 240px); aspect-ratio: 1; max-width: 100%; border-radius: 6px; }
.code { font-family: var(--mono); font-size: 12px; word-break: break-all; background: var(--soft); border-radius: 10px; padding: 12px; max-height: 140px; overflow: auto; user-select: all; }
.ok { font-size: 14px; color: var(--muted); }
/* ranking */
.q { font-size: 18px; font-weight: 500; }
.q em { font-style: normal; font-family: var(--mono); background: var(--soft); padding: 1px 6px; border-radius: 6px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 520px) { .grid.n3, .grid.n5, .grid.n6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.opt { position: relative; padding: 0; border: 2px solid transparent; border-radius: 12px; overflow: hidden; background: var(--soft); }
.opt img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.opt .tag { position: absolute; left: 8px; top: 8px; font-family: var(--mono); font-size: 12px; background: rgba(0,0,0,.55); color: #fff; padding: 2px 7px; border-radius: 6px; }
.opt .rk { position: absolute; right: 8px; top: 8px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 17px; }
.opt.on { border-color: var(--accent); }
.foot { font-size: 13px; color: var(--muted); text-align: center; }
/* rainbow text: saturated stops that stay readable on both themes */
.rainbow { font-size: 17px; font-weight: 600; line-height: 1.55;
  background: linear-gradient(90deg, #D7263D, #F46036, #E9A100, #2E9E44, #1B98E0, #3D5AFE, #8E44AD);
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rainbow {
  background-image: linear-gradient(90deg, #FF6B6B, #FF9F43, #FECA57, #48DB71, #54A0FF, #7F8CFF, #C56CF0); } }
ul.checks.emoji { list-style: none; padding-left: 0; gap: 8px; }
ul.checks.emoji li { display: flex; gap: 10px; align-items: flex-start; }
ul.checks.emoji li > span:first-child { flex: none; width: 1.4em; text-align: center; }
.pidtag { font-family: var(--mono); font-weight: 500; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.choice { background: var(--bg); color: var(--fg); border: 1.5px solid var(--line); text-align: left; padding: 11px 14px; font-weight: 400; }
.choice.on { border-color: var(--accent); background: var(--soft); font-weight: 500; }
.plate { width: min(72vw, 280px); aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: #fff; }
.plate-stage { background: #F2F0EA; border-radius: 14px; padding: 20px; display: grid; place-items: center; }
.wait { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.clock { font-family: var(--mono); font-feature-settings: "tnum"; font-size: 34px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.grp { display: flex; flex-direction: column; gap: 6px; }
.grp-h { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 14px; font-weight: 400; padding: 6px 10px; border-radius: 999px; background: var(--bg); color: var(--fg); border: 1.5px solid var(--line); }
.chip small { color: var(--muted); margin-left: 4px; font-size: 12px; }
.chip.on { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
.chip.on small { color: var(--accent-fg); opacity: .8; }
.picked { font-size: 15px; } .picked b { font-weight: 600; }
.ko { font-size: 13px; color: var(--muted); }
.grid4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: min(100%, 300px); margin: 14px auto; }
.grid9 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: min(100%, 360px); margin: 12px auto; }
.cell { aspect-ratio: 1; border-radius: 6px; border: 3px solid transparent; padding: 0; cursor: pointer; }
.axes { display: grid; grid-template-columns: auto 1fr; grid-template-rows: 1fr auto; gap: 6px; align-items: center; width: min(100%, 400px); margin: 8px auto; }
.axes .grid9 { margin: 0; width: 100%; }
.ax-y { align-self: stretch; display: flex; flex-direction: column; justify-content: space-between; font-size: 12px; line-height: 1.3; color: var(--muted); text-align: right; white-space: nowrap; padding: 2px 0; }
.ax-x { grid-column: 2; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); white-space: nowrap; }
.cell.on { border-color: var(--fg); box-shadow: 0 0 0 2px var(--bg) inset; }
.ab { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ab .opt .tag { font-size: 14px; padding: 3px 9px; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>

/* our images: poll the server in the background */
function setEta(s) { S.eta = s; S.etaAt = Date.now(); }

function survey(k) {

    <div class="btns"><button class="ghost" id="none">보이지 않음</button><button class="primary" id="ok">다음</button></div>
  </div>`);
  drawPlate(document.getElementById("plate"), P);
  const done = v => { S.survey["plate_" + P.id] = { digit: P.digit, answer: v }; survey(k + 1); };
  document.getElementById("ok").onclick = () => { const v = document.getElementById("ans").value.trim(); if (v) done(v); };
  document.getElementById("none").onclick = () => done("none");
  document.getElementById("ans").onkeydown = e => { if (e.key === "Enter" && e.target.value.trim()) done(e.target.value.trim()); };
}
function drawPlate(cv, P) {
  const ctx = cv.getContext("2d"), W = cv.width, R = W / 2 - 6;
  const mask = document.createElement("canvas"); mask.width = mask.height = W; const m = mask.getContext("2d");
  m.fillStyle = "#000"; m.font = `bold ${P.digit.length > 1 ? 250 : 320}px Arial, sans-serif`; m.textAlign = "center"; m.textBaseline = "middle";
  m.fillText(P.digit, W / 2, W / 2 + 12); const md = m.getImageData(0, 0, W, W).data;
  const inside = (x, y) => md[(Math.floor(y) * W + Math.floor(x)) * 4 + 3] > 128;
  const FG = P.kind === "control" ? ["#3E4A63", "#4B5873", "#36415A"] : ["#D8784F", "#CF6C46", "#E08A60", "#C96A48"];
  const BG = P.kind === "control" ? ["#D9C9A8", "#E3D5B8", "#CFBE9C"] : ["#A2A85A", "#98A052", "#AEB466", "#8F984C"];
  let seed = 7 + P.digit.charCodeAt(0); const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  ctx.clearRect(0, 0, W, W); const dots = [];
  for (let t = 0; t < 9000 && dots.length < 1100; t++) {
    const r = 5 + rnd() * 9, a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * (R - r);
    const x = W / 2 + Math.cos(a) * d, y = W / 2 + Math.sin(a) * d;
    if (dots.some(o => (o.x - x) ** 2 + (o.y - y) ** 2 < (o.r + r + 1.5) ** 2)) continue;
    dots.push({ x, y, r });
    const pal = inside(x, y) ? FG : BG; ctx.fillStyle = pal[Math.floor(rnd() * pal.length)];
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
}

async function afterSurvey() {
  S.timing.survey_ms = Math.round(performance.now() - S.tSurvey);

                     timing: Object.assign({ started_at: S.startedAt }, S.timing), at: new Date().toISOString(), v: VERSION })];
  S.queue = shuffle(ITEMS.filter(x => x.gen === "sd35")).concat(shuffle(ITEMS.filter(x => x.gen === "flux")));   // SD 3.5 images are ready first
  S.done = 0; nextItem();
}

/* ---------------- 3. A/B choices ---------------- */
function nextItem() {
  if (!S.queue.length) return finish();
  const j = S.queue.findIndex(x => S.ours[x.key]);                   // the first item whose guided image is ready
  if (j < 0) return waiting();
  const [it] = S.queue.splice(j, 1); ab(it);
}

function waiting() {
  if (!S.waitStart) S.waitStart = performance.now();                  // time spent waiting before this item

}

function ab(it) {

  </div>
  <div class="ab" id="ab">${sides.map((k, j) => `
    <button class="opt" data-k="${k}" aria-label="이미지 ${"AB"[j]}"><img src="${esc(src(k))}" alt=""><span class="tag">${"AB"[j]}</span></button>`).join("")}
  </div>`);
  document.getElementById("ab").onclick = e => {
    const b = e.target.closest(".opt"); if (!b) return; const choice = b.dataset.k;
    S.choices[it.key] = choice;
    S.sends = (S.sends || []).concat(sheet({ type: "rank", pid: S.pid, job: S.job, trial: it.key, gen: it.gen, prompt: it.id, object: it.object, color: it.color,
            rank: [choice], shown: sides.slice(), choice, ms: Math.round(performance.now() - S.tItem), wait_ms: S.waitMs,
            elapsed_ms: Math.round(performance.now() - S.tStart), at: new Date().toISOString(), v: VERSION }));   // sent in the background
    S.done++; nextItem();
  };
}

async function finish() {
  view(`${header("저장 중")}<h1>응답을 저장하고 있어요…</h1><p class="muted">이 페이지를 닫지 말아 주세요.</p>`);
  const ok = (await Promise.all(S.sends || [])).every(Boolean);
  if (ok) return view(`${header("완료")}
    <h1>모두 끝났습니다. 참여해 주셔서 감사합니다!</h1>
    <div class="card"><p>응답이 저장되었습니다. 이제 페이지를 닫으셔도 됩니다.</p></div>`);
  const code = encode({ pid: S.pid, job: S.job, answers: S.answers, survey: S.survey, sides: S.sides, choices: S.choices, v: VERSION });
  view(`${header("확인 필요")}
    <h1>일부 응답이 저장되지 않았을 수 있습니다.</h1>
    <div class="card"><p class="muted">아래 코드를 복사해서 연구자에게 보내 주세요.</p><div class="code">${esc(code)}</div></div>`);
}

(async () => {
  try { const c = await (await fetch("config.json", { cache: "no-store" })).json(); SERVER = (c.server || "").replace(/\/$/, ""); } catch (e) {}
  home();
})();
</script>
